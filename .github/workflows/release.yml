# 推 v* tag → 构建 Windows 免安装便携 ZIP（仅 rplayer.exe）→ 以草稿 Release 发布。
# 说明：当前只发免安装 ZIP，不打 NSIS/MSI 安装包（tauri.conf.json 里 bundle.active=false）。
name: Release

on:
  push:
    tags:
      - "v*" # 例如 v0.1.0

permissions:
  contents: write # 创建 / 更新 Release、上传产物

jobs:
  release-windows:
    name: Build portable ZIP (Windows 10/11)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install JS deps
        run: npm ci

      # 只编译 exe（--no-bundle 跳过打包器）；release+custom-protocol 会把前端内嵌进 exe
      - name: Build exe (no installer)
        run: npm run tauri build -- --no-bundle

      # 便携 ZIP：只放纯净的 rplayer.exe，不含任何 .md 文档
      - name: Package portable ZIP (exe only)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $zip = "rplayer_${version}_windows_x64_portable.zip"
          Compress-Archive -Path "target/release/rplayer.exe" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: rplayer ${{ github.ref_name }}
          generate_release_notes: true
          draft: true # 生成草稿，由你手动 Publish
          # v0.x 视为开发测试版（pre-release）；到 v1.0.0 起自动变为正式版
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body: |
            Windows 10 / 11 免安装便携版。解压后直接运行 `rplayer.exe`
            （需系统 WebView2，Win10/11 自带；未做代码签名，如遇 SmartScreen 选「更多信息 → 仍要运行」）。
            音乐库会持久化到 `rplayer.exe` 同级的 `library.json`。
          files: rplayer_*_windows_x64_portable.zip
