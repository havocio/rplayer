# 打 tag（v*）时自动构建 Windows 安装包并挂到 GitHub Release；也可在 Actions 页手动触发。
name: Release

on:
  push:
    tags:
      - "v*" # 例如 v0.1.0
  workflow_dispatch: {} # 允许在 Actions 里手动跑一次

permissions:
  contents: write # 创建 Release / 上传产物

jobs:
  release-windows:
    name: Build & publish (Windows 10/11)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install JS deps
        run: npm ci

      # 构建 exe + NSIS/MSI 安装包（自动执行 vite build 生成前端，再用 custom-protocol 内嵌）
      - name: Build Tauri app (nsis + msi)
        run: npm run tauri build -- --bundles nsis,msi

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse target/release/bundle -Include *.exe,*.msi | Select-Object FullName,Length

      # 兜底：把安装包作为工作流产物保留（即使下面的 Release 步骤失败也能下载）
      - name: Upload artifacts (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: rplayer-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # 发布到 GitHub Release：tag 已存在（push tag 触发）→ 建/更新该 tag 的 Release 并附安装包
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: rplayer ${{ github.ref_name }}
          generate_release_notes: true
          draft: true   # 生成草稿，由你手动在 Releases 页点击 Publish 正式发布
          prerelease: false
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
