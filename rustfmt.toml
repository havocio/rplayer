# rustfmt configuration (see the Rust skill's config template)
max_width = 100
tab_spaces = 4
edition = "2021"
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
wrap_comments = true
format_code_in_doc_comments = true
imports_granularity = "Crate"   # requires nightly `cargo fmt`; harmless on stable
group_imports = "StdExternalCrate"
