<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rplayer</title>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar: queue / library -->
      <aside id="sidebar">
        <header class="side-head">
          <div class="brand">
            <span class="logo" aria-hidden="true"></span>
            <h1>rplayer</h1>
          </div>
          <div class="add-btns">
            <button id="add-files" class="chip" title="添加文件">＋ 文件</button>
            <button id="add-folder" class="chip" title="添加文件夹">＋ 文件夹</button>
          </div>
        </header>
        <div class="queue-meta">
          <span id="queue-count">0 首</span>
          <span class="meta-actions">
            <button id="rescan" class="ghost" title="重新扫描已添加的文件夹（递归）">刷新</button>
            <button id="clear-queue" class="ghost" title="清空队列">清空</button>
          </span>
        </div>
        <ul id="playlist" class="playlist" tabindex="0"></ul>
      </aside>

      <!-- Main: now playing -->
      <main id="main">
        <section class="now">
          <div class="cover-wrap">
            <div id="cover" class="cover" data-empty="true">
              <div class="cover-fallback" aria-hidden="true">♪</div>
            </div>
          </div>
          <div class="now-text">
            <div id="np-title" class="np-title">未选择曲目</div>
            <div id="np-artist" class="np-artist">—</div>
            <div id="np-album" class="np-album">—</div>
            <div id="np-tags" class="np-tags"></div>
          </div>
        </section>

        <section class="transport">
          <div class="seek-row">
            <span id="time-cur" class="time">0:00</span>
            <input id="seek" class="range seek" type="range" min="0" max="100" value="0" step="0.1" />
            <span id="time-dur" class="time">0:00</span>
          </div>

          <div class="controls">
            <button id="btn-mode" class="ctrl" title="播放模式" aria-label="播放模式">
              <span id="mode-icon"></span>
            </button>
            <button id="btn-prev" class="ctrl" title="上一首" aria-label="上一首">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
            </button>
            <button id="btn-play" class="ctrl play" title="播放 / 暂停" aria-label="播放 / 暂停"></button>
            <button id="btn-next" class="ctrl" title="下一首" aria-label="下一首">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" /></svg>
            </button>
            <div class="vol">
              <button id="btn-mute" class="ctrl" title="静音" aria-label="静音"></button>
              <input id="volume" class="range vol-range" type="range" min="0" max="100" value="100" step="1" />
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
